<div class="pagina">

  <div class="form-container">
    <h2>Crear Usuario</h2>

    <div class="campo">
      <label>Nombre <span class="requerido">*</span></label>
      <input
        type="text"
        [(ngModel)]="nuevoUsuario.nombre"
        placeholder="Ingresa el nombre"
      />
    </div>

    <div class="campo">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="nuevoUsuario.email"
        placeholder="Ingresa el email (opcional)"
      />
    </div>

    <div class="campo">
      <label>Contraseña <span class="requerido">*</span></label>
      <input
        type="password"
        [(ngModel)]="nuevoUsuario.contrasena"
        placeholder="Ingresa la contraseña"
      />
    </div>

    @if (error) {
      <p class="mensaje error">{{ error }}</p>
    }
    @if (exito) {
      <p class="mensaje exito">{{ exito }}</p>
    }

    <div class="form-acciones">
      <button class="btn-primary" (click)="crear()" [disabled]="cargando">
        {{ cargando ? 'Creando...' : 'Crear usuario' }}
      </button>
      <button class="btn-secondary" (click)="irAListar()">Volver</button>
    </div>

  </div>

</div>
